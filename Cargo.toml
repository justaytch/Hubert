[package]
name = "hubert"
version = "0.1.0"
edition = "2024"

[dependencies]
serenity = "0.12"
tokio = { version = "1.21.2", features = ["full"] }
reqwest = { version = "0.12", features = ["json"] }
serde = { version = "1.0", features = ["derive"] }
regex = "1.13.1"
serde_json = "1.0"
fluxer-core = { version = "0.3.1", default-features = false }
fluxer-builders = "0.3.1"
fluxer-rest = "0.3.1"
futures = "0.3.34"
